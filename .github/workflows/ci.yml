name: CI

on:
  push:
    branches: [main, thinkbook]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: BIOS boot sector build & static check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build boot sector
        run: make build

      - name: Verify 512-byte image
        run: make test

      - name: Upload boot image
        uses: actions/upload-artifact@v7
        with:
          name: boot-bin
          path: boot.bin
          if-no-files-found: error

  boot-smoke:
    name: QEMU BIOS boot smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install NASM and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Build boot sector
        run: make build

      - name: Boot in QEMU and check VGA output
        env:
          REQUIRE_QEMU: "1"
        run: make smoke

  uefi-build:
    name: UEFI build & static check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross compiler and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 gdisk dosfstools mtools

      - name: Build and verify BOOTX64.EFI
        run: make uefi-test

      - name: Build bootable USB image
        run: make uefi-image

      - name: Upload UEFI application
        uses: actions/upload-artifact@v7
        with:
          name: bootx64-efi
          path: uefi/BOOTX64.EFI
          if-no-files-found: error

      - name: Upload USB image
        uses: actions/upload-artifact@v7
        with:
          name: thinkbook-usb-image
          path: dist/thinkbook-esp.img
          if-no-files-found: error

  uefi-smoke:
    name: QEMU UEFI boot smoke test
    runs-on: ubuntu-latest
    needs: uefi-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cross compiler, QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 qemu-system-x86 ovmf

      - name: Build and boot in OVMF
        env:
          REQUIRE_QEMU: "1"
        run: make uefi-smoke
