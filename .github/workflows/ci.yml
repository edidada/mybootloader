name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & static check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build boot sector
        run: make build

      - name: Verify 512-byte image
        run: make test

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-bin
          path: boot.bin
          if-no-files-found: error

  boot-smoke:
    name: QEMU boot smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Build boot sector
        run: make build

      - name: Boot in QEMU and check VGA output
        run: make smoke
